name: Build Godot 4 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download Godot 4.3 Stable & Export Templates
        run: |
          GODOT_VERSION="4.3"
          GODOT_RELEASE="4.3-stable"
          
          echo "Downloading Godot Headless Engine..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot Export Templates..."
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_RELEASE}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          
          godot --version

      - name: Generate Android Debug Keystore
        working-directory: godot_game
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/godot_game/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = false
          EOF

      - name: Export Godot Android APK
        working-directory: godot_game
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/Pirate_Seas_Online_Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pirate-Seasonline-Godot-APK
          path: godot_game/build/Pirate_Seas_Online_Debug.apk
          if-no-files-found: error
          retention-days: 14
